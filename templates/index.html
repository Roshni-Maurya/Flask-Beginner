<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
</head>
<body>
    
    {% if is_logged_in %}   {#  if statement{%%} use this  #}
     <h1>Welcome Back!</h1>
     {% else %}
     <h1>Please login..</h1>
     {% endif %}

     {% if marks >= 90 %}
     <h2>Grade A</h2>
     {% elif marks >=75%}
     <h2>Grade B</h2>
     {% elif marks >=65%}
     <h2>Grade c</h2>
     {% else %}
     <h2>Fail</h2>
     {% endif %}



</body>
</html>
